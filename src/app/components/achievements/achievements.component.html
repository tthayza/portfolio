<section class="journey {{ currentTheme }}">
  <app-heading textContent="Jornada"></app-heading>
  
  <div class="journey-header">
    <h3 class="{{ currentTheme }}">Minha Jornada</h3>
    <p class="subtitle {{ currentTheme }}">Marcos da minha trajetória profissional em tecnologia e negócios</p>
  </div>

  <div class="roadmap-track-container">
    <!-- SVG Wavy Ribbon Track running across the top of cards -->
    <div class="wave-svg-wrapper">
      <svg class="wave-svg" viewBox="0 0 1200 160" fill="none" preserveAspectRatio="none">
        <defs>
          <filter id="trackShadow" x="-5%" y="-20%" width="110%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000"/>
          </filter>
        </defs>

        <!-- Outer Track Border -->
        <path class="track-border {{ currentTheme }}"
              d="M -20 100 C 10 60, 25 45, 45 45 C 90 45, 120 145, 175 145 C 230 145, 270 45, 315 45 C 360 45, 400 145, 458 145 C 515 145, 555 45, 600 45 C 645 45, 685 145, 742 145 C 800 145, 840 45, 885 45 C 930 45, 970 145, 1028 145 C 1085 145, 1125 45, 1170 45 C 1190 45, 1205 60, 1220 100"
              stroke-width="18" stroke-linecap="round" filter="url(#trackShadow)"/>

        <!-- Middle Track Ribbon -->
        <path class="track-fill {{ currentTheme }}"
              d="M -20 100 C 10 60, 25 45, 45 45 C 90 45, 120 145, 175 145 C 230 145, 270 45, 315 45 C 360 45, 400 145, 458 145 C 515 145, 555 45, 600 45 C 645 45, 685 145, 742 145 C 800 145, 840 45, 885 45 C 930 45, 970 145, 1028 145 C 1085 145, 1125 45, 1170 45 C 1190 45, 1205 60, 1220 100"
              stroke-width="14" stroke-linecap="round"/>

        <!-- Railway / Ladder Stitching Pattern (matching reference image) -->
        <path class="track-dash {{ currentTheme }}"
              d="M -20 100 C 10 60, 25 45, 45 45 C 90 45, 120 145, 175 145 C 230 145, 270 45, 315 45 C 360 45, 400 145, 458 145 C 515 145, 555 45, 600 45 C 645 45, 685 145, 742 145 C 800 145, 840 45, 885 45 C 930 45, 970 145, 1028 145 C 1085 145, 1125 45, 1170 45 C 1190 45, 1205 60, 1220 100"
              stroke-width="10" stroke-dasharray="2 6" stroke-linecap="butt"/>
      </svg>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid">
      <div *ngFor="let item of journeyItems" class="milestone-column">
        <!-- Number Circle Badge (resting at wave dip) -->
        <div class="badge-node {{ currentTheme }}">
          <span>{{ item.step }}</span>
        </div>

        <!-- Milestone Card -->
        <div class="milestone-card {{ currentTheme }}">
          <span class="m-tag {{ currentTheme }}">{{ item.year }} • {{ item.badge }}</span>
          <h4 class="m-title {{ currentTheme }}">{{ item.title }}</h4>
          <div class="m-divider {{ currentTheme }}"></div>
          <p class="m-comment {{ currentTheme }}">{{ item.comment }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
